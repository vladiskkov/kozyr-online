# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kozyr-online
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      # Client ID is public (it is visible in the page anyway); the secret is never needed
      - key: GOOGLE_CLIENT_ID
        value: 96122002055-12t0takn8c80cb4u530epn1ti05lh8v8.apps.googleusercontent.com
      - key: ALLOW_GUESTS
        value: "true"
      # Postgres connection string for the global leaderboard (e.g. a free Neon database).
      # Without it the leaderboard lives in memory and resets when the server sleeps.
      - key: DATABASE_URL
        sync: false
